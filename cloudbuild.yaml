steps:
  # 1. Enable all required APIs first
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud services enable \
          cloudfunctions.googleapis.com \
          cloudbuild.googleapis.com \
          run.googleapis.com \
          artifactregistry.googleapis.com \
          eventarc.googleapis.com \
          pubsub.googleapis.com \
          storage.googleapis.com

  # 2. Deploy the Bucket and Topics (Swallow error if already exists)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args: 
      - '-c'
      - |
        gcloud deployment-manager deployments create my-pubsub-stack --config main.yaml || \
        gcloud deployment-manager deployments update my-pubsub-stack --config main.yaml || \
        echo "Deployment already up to date"

  # 3. Deploy the News Function
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: 
      - 'functions'
      - 'deploy'
      - 'news-processor'
      - '--gen2'
      - '--runtime=nodejs20'
      - '--region=us-central1'
      - '--source=.'
      - '--entry-point=handleNews'
      - '--trigger-topic=news'

  # 4. Deploy the Tutorials Function
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: 
      - 'functions'
      - 'deploy'
      - 'tutorials-processor'
      - '--gen2'
      - '--runtime=nodejs20'
      - '--region=us-central1'
      - '--source=.'
      - '--entry-point=handleTutorials'
      - '--trigger-topic=tutorials'

options:
  logging: CLOUD_LOGGING_ONLY