resources:
# 1. The Storage Bucket
- name: project-storage
  type: storage.v1.bucket
  properties:
    location: US-CENTRAL1

# 2. Pub/Sub Topics
- name: news-topic
  type: pubsub.v1.topic
  properties:
    topic: news

- name: tutorials-topic
  type: pubsub.v1.topic
  properties:
    topic: tutorials

# 3. Cloud Function for News
- name: news-processor
  type: gcp-types/cloudfunctions-v2:projects.locations.functions
  properties:
    location: us-central1
    function: news-processor
    buildConfig:
      runtime: nodejs20
      entryPoint: handleNews
      source:
        storageSource:
          bucket: project-storage-deploy
          object: news-code.zip
    eventTrigger:
      eventType: google.cloud.pubsub.topic.v1.messagePublished
      pubsubTopic: projects/$(ref.news-topic.project)/topics/news-topic

# 4. Cloud Function for Tutorials
- name: tutorials-processor
  type: gcp-types/cloudfunctions-v2:projects.locations.functions
  properties:
    location: us-central1
    function: tutorials-processor
    buildConfig:
      runtime: nodejs20
      entryPoint: handleTutorials
      source:
        storageSource:
          bucket: project-storage-deploy
          object: tutorials-code.zip
    eventTrigger:
      eventType: google.cloud.pubsub.topic.v1.messagePublished
      pubsubTopic: projects/$(ref.tutorials-topic.project)/topics/tutorials-topic